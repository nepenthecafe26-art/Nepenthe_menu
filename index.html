<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کافه نپنته | منو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e0c;
    --panel:#121a16;
    --card:#161f1a;
    --ink:#eef1ee;
    --ink-dim:#8fa098;
    --cream:#efe9dc;
    --charcoal:#2b2b28;
    --gold:#5c8974;
    --gold-soft:rgba(92,137,116,0.24);
    --green:#5c8974;
    --line:rgba(239,233,220,0.09);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Vazirmatn', sans-serif;
    height:100svh;
    overflow:hidden;
  }
  .app-shell{ display:flex; flex-direction:column; height:100svh; }

  /* ---------------- TOP BAR ---------------- */
  .topbar{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; gap:0.3rem;
    padding:0.8rem 1rem 0.7rem;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #0f1512, transparent);
  }
  .brand-badge{
    background:var(--cream);
    color:var(--charcoal);
    font-family:'Vazirmatn', sans-serif;
    font-weight:800;
    font-size:1.15rem;
    letter-spacing:0.1em;
    padding:0.35rem 1.3rem;
    border-radius:8px;
  }
  .topbar .sub{
    font-family:'Vazirmatn', sans-serif;
    font-weight:500;
    font-size:0.85rem;
    color:var(--gold);
  }
  .topbar .delivery-note{
    font-family:'Vazirmatn', sans-serif;
    font-size:0.68rem;
    color:var(--ink-dim);
  }

  /* ---------------- LAYOUT ---------------- */
  .layout{ flex:1; display:flex; min-height:0; direction:ltr; }
  .layout > *{ direction:rtl; }

  /* sidebar */
  .sidebar{
    flex:0 0 92px;
    overflow-y:auto;
    padding:1rem 0.4rem 1rem;
    display:flex; flex-direction:column; align-items:center; gap:1.3rem;
    border-right:1px solid var(--line);
    background:#0e0e10;
    scrollbar-width:none;
  }
  .sidebar::-webkit-scrollbar{ display:none; }
  .cat-btn{
    background:none; border:none; color:var(--ink-dim);
    display:flex; flex-direction:column; align-items:center; gap:0.4rem;
    cursor:pointer; width:100%;
    font-family:inherit;
  }
  .cat-thumb{
    width:58px; height:58px; border-radius:50%;
    background-size:cover; background-position:center;
    border:2px solid transparent;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
    transition:border-color .25s, transform .25s, box-shadow .25s;
  }
  .cat-btn.active .cat-thumb{
    border-color:var(--gold);
    box-shadow:0 0 0 3px var(--gold-soft), 0 4px 16px rgba(240,192,75,0.25);
    transform:scale(1.06);
  }
  .cat-btn span.lbl{
    font-size:0.68rem; font-weight:600;
    color:var(--ink-dim);
    transition:color .25s;
  }
  .cat-btn.active span.lbl{ color:var(--gold); }

  /* main panel */
  .panel{ flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; }

  .panel-hero{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center;
    padding:1.1rem 0 0.8rem;
  }
  .hero-emblem{
    width:78px; height:78px; border-radius:50%;
    background-size:cover; background-position:center;
    border:2px solid var(--gold);
    box-shadow:0 0 0 6px var(--gold-soft), 0 0 24px rgba(240,192,75,0.25);
    animation:pulse 3s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 6px var(--gold-soft), 0 0 24px rgba(240,192,75,0.25); }
    50%{ box-shadow:0 0 0 9px var(--gold-soft), 0 0 34px rgba(240,192,75,0.4); }
  }
  .hero-label{
    margin-top:0.6rem;
    font-family:'Vazirmatn', sans-serif;
    font-weight:600;
    font-size:1.05rem;
    color:var(--gold);
  }

  .products-scroll{ flex:1; overflow-y:auto; padding:0.4rem 1rem 1.2rem; }
  .products-grid{ display:flex; flex-direction:column; gap:1.1rem; }

  .product-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    opacity:0; transform:translateY(14px);
    animation:rise .5s ease forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:none; } }

  .product-img{
    position:relative;
    width:100%; aspect-ratio:4/3;
    background-size:cover; background-position:center;
  }
  .product-img.placeholder{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.4rem;
    background:linear-gradient(155deg, #1c2a23, #10160f 70%);
  }
  .product-img.placeholder svg{ width:34px; height:34px; color:var(--gold); opacity:0.7; }
  .product-img.placeholder span{ font-size:0.72rem; color:var(--ink-dim); }
  .cat-thumb.placeholder{
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, #1c2a23, #10160f 70%);
  }
  .cat-thumb.placeholder svg{ width:22px; height:22px; color:var(--gold); opacity:0.8; }
  .hero-emblem.placeholder{
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, #1c2a23, #10160f 70%);
  }
  .hero-emblem.placeholder svg{ width:28px; height:28px; color:var(--gold); opacity:0.8; }
  .discount-tag{
    position:absolute; top:10px; right:10px;
    background:var(--green); color:#fff;
    font-size:0.7rem; font-weight:700;
    padding:0.28rem 0.6rem; border-radius:8px;
  }
  .product-body{ padding:0.9rem 1rem 1rem; }
  .product-title{ font-weight:700; font-size:1rem; }
  .product-desc{
    margin-top:0.35rem; color:var(--ink-dim); font-size:0.8rem; line-height:1.7;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .price-row{ margin-top:0.6rem; display:flex; align-items:baseline; gap:0.5rem; }
  .price-now{ color:var(--gold); font-weight:700; font-size:0.95rem; }
  .price-old{ color:var(--ink-dim); font-size:0.78rem; text-decoration:line-through; }
  .price-unit{ color:var(--ink-dim); font-size:0.72rem; }
  .price-note{ color:var(--ink-dim); font-size:0.8rem; }

  .action-row{ margin-top:0.85rem; display:flex; align-items:center; gap:0.55rem; }
  .icon-pill{
    display:flex; align-items:center; gap:0.3rem;
    background:#26262a; border:1px solid var(--line);
    border-radius:10px; padding:0.5rem 0.65rem;
    color:var(--ink-dim); font-size:0.75rem;
    cursor:pointer; transition:color .2s, border-color .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .icon-pill svg{ width:15px; height:15px; }
  .icon-pill.liked{ color:#e05a5a; border-color:#e05a5a55; }
  .add-btn{
    flex:1;
    background:var(--gold);
    color:#171205;
    border:none; border-radius:10px;
    padding:0.65rem 0.8rem;
    font-family:inherit; font-weight:700; font-size:0.82rem;
    display:flex; align-items:center; justify-content:center; gap:0.4rem;
    cursor:pointer;
    transition:transform .15s, filter .15s;
  }
  .add-btn:active{ transform:scale(0.97); filter:brightness(0.95); }
  .add-btn svg{ width:16px; height:16px; }

  /* ---------------- CART BAR ---------------- */
  .cartbar{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:0.9rem 1.2rem;
    background:#141416;
    border-top:1px solid var(--line);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .cartbar .left{ display:flex; align-items:center; gap:0.5rem; color:var(--ink-dim); font-size:0.85rem; }
  .cartbar .left svg{ width:18px; height:18px; color:var(--gold); }
  .cartbar .count{
    background:var(--gold); color:#171205; font-weight:800; font-size:0.72rem;
    width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .cartbar .total{ color:var(--gold); font-weight:700; font-size:0.85rem; }

  /* ---------------- CART SHEET ---------------- */
  .cart-overlay{
    position:fixed; inset:0; z-index:300;
    background:rgba(4,6,5,0.6);
    display:flex; align-items:flex-end;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .cart-overlay.open{ opacity:1; pointer-events:auto; }
  .cart-sheet{
    width:100%; max-height:78svh;
    background:var(--panel);
    border-radius:20px 20px 0 0;
    border-top:1px solid var(--line);
    display:flex; flex-direction:column;
    transform:translateY(100%);
    transition:transform .3s ease;
  }
  .cart-overlay.open .cart-sheet{ transform:translateY(0); }
  .cart-sheet-head{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:1rem 1.1rem 0.8rem;
    border-bottom:1px solid var(--line);
  }
  .cart-sheet-head h3{ font-size:1rem; font-weight:700; }
  .cart-close{
    background:none; border:none; color:var(--ink-dim);
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .cart-close svg{ width:18px; height:18px; }
  .cart-list{ flex:1; overflow-y:auto; padding:0.5rem 1.1rem; }
  .cart-empty{ padding:2.4rem 0; text-align:center; color:var(--ink-dim); font-size:0.85rem; }
  .cart-row{
    display:flex; align-items:center; gap:0.7rem;
    padding:0.8rem 0;
    border-bottom:1px solid var(--line);
  }
  .cart-row .thumb{
    width:46px; height:46px; border-radius:10px; flex:0 0 auto;
    background:linear-gradient(155deg, #1c2a23, #10160f 70%);
    display:flex; align-items:center; justify-content:center;
    background-size:cover; background-position:center;
  }
  .cart-row .thumb svg{ width:18px; height:18px; color:var(--gold); opacity:0.7; }
  .cart-row .info{ flex:1; min-width:0; }
  .cart-row .info .nm{ font-size:0.86rem; font-weight:600; }
  .cart-row .info .pr{ margin-top:0.2rem; font-size:0.76rem; color:var(--gold); }
  .qty-ctrl{ display:flex; align-items:center; gap:0.5rem; }
  .qty-ctrl button{
    width:26px; height:26px; border-radius:7px;
    background:#26262a; border:1px solid var(--line); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:1rem;
  }
  .qty-ctrl span{ min-width:16px; text-align:center; font-size:0.85rem; }
  .remove-btn{
    background:none; border:none; color:#e05a5a;
    width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:0 0 auto;
  }
  .remove-btn svg{ width:17px; height:17px; }
  .cart-sheet-foot{
    flex:0 0 auto;
    padding:0.9rem 1.1rem calc(0.9rem + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .cart-sheet-foot .grand{ color:var(--gold); font-weight:800; font-size:1rem; }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <span class="brand-badge">NEPENTHE</span>
    <span class="delivery-note">روی سرویس بیرون‌بر ۳۰,۰۰۰ تومان اضافه می‌شود</span>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <section class="panel">
      <div class="panel-hero">
        <div class="hero-emblem" id="heroEmblem"></div>
        <div class="hero-label" id="heroLabel"></div>
      </div>
      <div class="products-scroll">
        <div class="products-grid" id="products"></div>
      </div>
    </section>
  </div>

  <div class="cartbar" id="cartbarBtn">
    <div class="left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      <span>سبد خرید</span>
      <span class="count" id="cartCount">۰</span>

</div>

<div class="cart-overlay" id="cartOverlay">
  <div class="cart-sheet">
    <div class="cart-sheet-head">
      <h3>سبد خرید</h3>
      <button class="cart-close" id="cartCloseBtn" aria-label="بستن">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="cart-sheet-foot">
      <span style="color:var(--ink-dim); font-size:0.82rem;">جمع کل</span>
      <span class="grand" id="cartGrandTotal">۰ تومان</span>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>

const fmt = n => toFa(n.toLocaleString('en-US'));

// img: '' means "waiting for the real product photo" -> renders a clean placeholder tile.
// Once you send your photos, each gets dropped into the matching img field.

const IMG_PLACEHOLDER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10.5" r="1.6"/><path d="M21 15l-5.5-5.5L4 20"/></svg>';

// ── Live menu data (Netlify Function + Netlify Blobs) ────────────────────
// localStorage is kept only as an offline fallback cache.
const MENU_STORAGE_KEY = 'nepentheMenuData';
let categories = DEFAULT_CATEGORIES;
let products = DEFAULT_PRODUCTS;
let active = 'hot_coffee';
// cart is a real state object now: { key: { name, price, img, qty } }
let cart = {};

const sidebar = document.getElementById('sidebar');
const heroEmblem = document.getElementById('heroEmblem');
const heroLabel = document.getElementById('heroLabel');
const productsEl = document.getElementById('products');
const cartOverlay = document.getElementById('cartOverlay');
const cartList = document.getElementById('cartList');

function renderSidebar(){
  sidebar.innerHTML = categories.map(c => `
    <button class="cat-btn ${c.id===active?'active':''}" data-id="${c.id}">
      <span class="cat-thumb ${c.img?'':'placeholder'}" style="${c.img?`background-image:url('${c.img}')`:''}">${c.img?'':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10.5" r="1.6"/><path d="M21 15l-5.5-5.5L4 20"/></svg>'}</span>
      <span class="lbl">${c.label}</span>
    </button>
  `).join('');
  sidebar.querySelectorAll('.cat-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ active = btn.dataset.id; render(); });
  });
}

function renderHero(){
  const cat = categories.find(c=>c.id===active);
  heroEmblem.className = 'hero-emblem' + (cat.img ? '' : ' placeholder');
  heroEmblem.style.backgroundImage = cat.img ? `url('${cat.img}')` : '';
  heroEmblem.innerHTML = cat.img ? '' : IMG_PLACEHOLDER_ICON;
  heroLabel.textContent = cat.label;
}

function renderProducts(){
  const list = products[active] || [];
  productsEl.innerHTML = list.map((p,i)=>`
    <article class="product-card" style="animation-delay:${i*0.06}s">
      <div class="product-img ${p.img?'':'placeholder'}" style="${p.img?`background-image:url('${p.img}')`:''}">
        ${p.img ? '' : IMG_PLACEHOLDER_ICON + '<span>عکس محصول در انتظار</span>'}
        ${p.discount ? `<span class="discount-tag">${p.discount}</span>` : ''}
      </div>
      <div class="product-body">
        <div class="product-title">${p.name}</div>
        ${p.desc ? `<p class="product-desc">${p.desc}</p>` : ''}
        <div class="price-row">
          ${p.price != null ? `
            ${p.old ? `<span class="price-old">${fmt(p.old)}</span>` : ''}
            <span class="price-now">${fmt(p.price)}</span>
            <span class="price-unit">تومان</span>
          ` : `<span class="price-note">قیمت بر اساس کیک روز، از کارکنان بپرسید</span>`}
        </div>
        <div class="action-row">
          <button class="icon-pill like-btn" aria-label="پسندیدن">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-9.5-9C.7 7.4 3 4 6.5 4c2 0 3.6 1.2 4.5 2.7C11.9 5.2 13.5 4 15.5 4 19 4 21.3 7.4 19.5 11 17 15.6 12 20 12 20z"/></svg>
          </button>
          ${p.price != null ? `
            <button class="add-btn" data-key="${active}__${p.name}" data-name="${p.name}" data-price="${p.price}" data-img="${p.img||''}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              افزودن به سبد
            </button>
          ` : ''}
        </div>
      </div>
    </article>
  `).join('');

  productsEl.querySelectorAll('.like-btn').forEach(b=>{
    b.addEventListener('click', ()=> b.classList.toggle('liked'));
  });
  productsEl.querySelectorAll('.add-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const key = b.dataset.key;
      if(cart[key]){ cart[key].qty += 1; }
      else{ cart[key] = { name:b.dataset.name, price:Number(b.dataset.price), img:b.dataset.img, qty:1 }; }
      updateCartBadges();
      b.style.transform = 'scale(0.94)';
      setTimeout(()=> b.style.transform = '', 150);
    });
  });
}

function cartCountTotal(){
  let count = 0, total = 0;
  Object.values(cart).forEach(it => { count += it.qty; total += it.qty * it.price; });
  return { count, total };
}

function updateCartBadges(){
  const { count, total } = cartCountTotal();
  document.getElementById('cartCount').textContent = fmt(count);
  document.getElementById('cartTotal').textContent = fmt(total) + ' تومان';
  document.getElementById('cartGrandTotal').textContent = fmt(total) + ' تومان';
  renderCartList();
}

function renderCartList(){
  const entries = Object.entries(cart);
  if(entries.length === 0){
    cartList.innerHTML = '<div class="cart-empty">سبد خریدت هنوز خالیه</div>';
    return;
  }
  cartList.innerHTML = entries.map(([key, it]) => `
    <div class="cart-row" data-key="${key}">
      <div class="thumb" style="${it.img?`background-image:url('${it.img}')`:''}">${it.img?'':IMG_PLACEHOLDER_ICON}</div>
      <div class="info">
        <div class="nm">${it.name}</div>
        <div class="pr">${fmt(it.price)} تومان</div>
      </div>
      <div class="qty-ctrl">
        <button class="qty-minus" aria-label="کم کردن">−</button>
        <span>${toFa(it.qty)}</span>
        <button class="qty-plus" aria-label="زیاد کردن">+</button>
      </div>
      <button class="remove-btn" aria-label="حذف">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m2 0-1 13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 7"/></svg>
      </button>
    </div>
  `).join('');

  cartList.querySelectorAll('.cart-row').forEach(row=>{
    const key = row.dataset.key;
    row.querySelector('.qty-plus').addEventListener('click', ()=>{
      cart[key].qty += 1; updateCartBadges();
    });
    row.querySelector('.qty-minus').addEventListener('click', ()=>{
      cart[key].qty -= 1;
      if(cart[key].qty <= 0) delete cart[key];
      updateCartBadges();
    });
    row.querySelector('.remove-btn').addEventListener('click', ()=>{
      delete cart[key];
      updateCartBadges();
    });
  });
}

function openCart(){ cartOverlay.classList.add('open'); renderCartList(); }
function closeCart(){ cartOverlay.classList.remove('open'); }

document.getElementById('cartbarBtn').addEventListener('click', openCart);
document.getElementById('cartCloseBtn').addEventListener('click', closeCart);
cartOverlay.addEventListener('click', (e)=>{ if(e.target === cartOverlay) closeCart(); });

function render(){
  renderSidebar();
  renderHero();
  renderProducts();
  document.querySelector('.products-scroll').scrollTop = 0;
}

async function loadMenuData(){
  try{
    const res = await fetch('/.netlify/functions/menu');
    if(res.ok){
      const remote = await res.json();
      if(remote && remote.categories && remote.products){
        categories = remote.categories;
        products = remote.products;
        try{ localStorage.setItem(MENU_STORAGE_KEY, JSON.stringify(remote)); }catch(e){}
      }
    }
  }catch(e){
    // offline — fall back to the last copy saved on this device, else the built-in defaults
    try{
      const saved = localStorage.getItem(MENU_STORAGE_KEY);
      if(saved){
        const parsed = JSON.parse(saved);
        if(parsed && parsed.categories && parsed.products){
          categories = parsed.categories;
          products = parsed.products;
        }
      }
    }catch(e2){}
  }
  active = categories[0] ? categories[0].id : 'hot_coffee';
  render();
}

loadMenuData();
</script>
</body>
</html>
